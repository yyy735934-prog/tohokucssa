# ============================================================
# 部署配置 — 每个新客户部署前必须修改：
#   1. name         → 客户专属 worker 名称（不可重复）
#   2. database_id  → 新建 D1: npx wrangler d1 create <客户名>-db
#   3. kv id        → 新建 KV: npx wrangler kv namespace create SESSIONS
#   4. bucket_name  → 新建 R2: npx wrangler r2 bucket create <客户名>-images
#   5. routes       → 客户域名（可选，没有就注释掉用 workers.dev）
# 建表: npx wrangler d1 execute <db名> --remote --file=schema.sql
# 密钥: npx wrangler secret put RESEND_API_KEY   （邮件发送）
#       npx wrangler secret put EMAIL_FROM        （发件人，如 活动平台 <no-reply@域名>）
#       npx wrangler secret put GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET （谷歌登录，可选）
# 同时记得修改根目录 branding.js（平台名称、组织名、域名、学校列表）
# ============================================================

name = "change-me-event-platform"
main = "worker/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "change-me-db"
database_id = "change-me"

[[kv_namespaces]]
binding = "SESSIONS"
id = "change-me"

# AI 计划书生成（Cloudflare Workers AI，按量计费）
[ai]
binding = "AI"

# 客户自定义域名（域名 zone 必须在同一 Cloudflare 账号下）
# [[routes]]
# pattern = "events.customer-domain.com"
# custom_domain = true

# 定时任务：每天 JST 上午9点（UTC 0点）发送活动提醒 + 签到码
[triggers]
crons = ["0 0 * * *"]

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "change-me-images"
