name = "event-platform"
main = "worker/index.js"
compatibility_date = "2026-09-07"
workers_dev = true

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "event-platform-db"
database_id = "68a64b77-9303-4349-b6b5-d4a4c61ef4c3"
migrations_dir = "migrations"
migrations_table = "d1_migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "be453d45637e4240a5dfa3768485c387"

[ai]
binding = "AI"

# Custom domain (zone must be in the same Cloudflare account)
[[routes]]
pattern = "events.tohokucssa.org"
custom_domain = true

# Cron: every 5 minutes. Business rules use JST and template-specific times.
# The original reminder/close jobs still run once daily at 09:00 JST.
[triggers]
crons = ["*/5 * * * *"]

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "event-images"

# Email secrets: RESEND_API_KEY, EMAIL_FROM
# CometChat server-only secrets: COMETCHAT_APP_ID, COMETCHAT_REGION,
# COMETCHAT_REST_API_KEY. Never expose the REST API key to either Vite bundle.

